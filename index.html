<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>KPI Analytics Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.52.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.52.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: ["pandas"],
        entrypoint: "app.py",
        files: { "app.py": { url: "app.py" } }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
